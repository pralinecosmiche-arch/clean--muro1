<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Clean</title>
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
body, html { margin:0; overflow:hidden; background:#000; }
#msg { position:absolute; top:10px; width:100%; color:white; text-align:center; z-index:10; font-family:Arial; }
</style>
</head>
<body>
<div id="msg">Inquadra il marker per vedere l'opera</div>

<a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
  <!-- Marker e opera -->
  <a-marker type="pattern" url="marker.patt">
    <a-plane src="opera.png" width="2" height="1" rotation="-90 0 0"></a-plane>
  </a-marker>

  <!-- Fotocamera -->
  <a-entity camera></a-entity>
</a-scene>

<script>
  // Aggiungiamo un piccolo controllo per assicurarci che la fotocamera parta
  document.querySelector('a-scene').addEventListener('loaded', () => {
    // Qui possiamo eventualmente aggiungere logica per garantire che la fotocamera sia attivata
    console.log('AR.js scene loaded and camera should be active.');
  });
</script>

</body>
</html>
